[package]
name = "issue-tracker"
version.workspace = true
edition.workspace = true

[lib]
name = "issue_tracker"
path = "src/lib.rs"

[[bin]]
name = "issue-tracker"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
actix-web = { version = "4", default-features = false, features = ["macros", "compress-gzip", "cookies"] }
mongodb = "3"
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
argon2 = { version = "0.5", features = ["std"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
comrak = { version = "0.59.0", default-features = false, features = ["shortcodes"] }
ammonia = "4.2.4"
regex = "1.13.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

[dev-dependencies]
actix-http = "3"
